{% extends "layout.html" %}
{% block title %}Thống kê chi tiêu{% endblock %}
{% block content %}
<h2>Thống kê chi tiêu</h2>
<canvas id="expenseChart" width="400" height="200"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    var ctx = document.getElementById('expenseChart').getContext('2d');
    var expenseChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Ăn uống', 'Đi lại', 'Mua sắm', 'Giải trí', 'Khác'],
            datasets: [{
                label: 'Chi tiêu theo danh mục',
                data: [12, 19, 3, 5, 2], // Dữ liệu mẫu, thay thế bằng dữ liệu thực tế
                backgroundColor: ['#FF5733', '#33FF57', '#3357FF', '#FF33A8', '#FF8C33'],
                borderColor: ['#FF5733', '#33FF57', '#3357FF', '#FF33A8', '#FF8C33'],
                borderWidth: 1
            }]
        }
    });
</script>
{% endblock %}
